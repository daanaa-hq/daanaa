<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeritGiving</title>
<style>
:root{--bg:#fafaf9;--surface:#fff;--text:#0f172a;--text2:#64748b;--text3:#a8a29e;--border:#e2e8f0;--primary:#4f46e5;--primary-light:#ede9fe;--primary-dark:#3730a3;--accent:#f97316;--accent-light:#fff7ed;--success:#10b981;--warning:#f59e0b;--love:#ef4444;--radius:20px;--radius-sm:12px;--shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 20px rgba(0,0,0,0.03);--shadow-lg:0 20px 60px rgba(0,0,0,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
.hero{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 50%,#8b5cf6 100%);color:white;padding:80px 20px 50px;text-align:center}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:16px}
.hero p{font-size:18px;opacity:0.9;max-width:520px;margin:0 auto 28px}
.search-wrap{max-width:600px;margin:0 auto;display:flex;background:white;border-radius:100px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,0.25);padding:6px}
#q{flex:1;padding:16px 24px;font-size:17px;border:none;outline:none;color:var(--text)}
.search-btn{padding:0 32px;background:var(--primary);color:white;border:none;font-size:16px;font-weight:700;cursor:pointer;border-radius:100px}
.stats{display:flex;gap:20px;justify-content:center;margin-top:28px;font-size:14px;opacity:0.8;flex-wrap:wrap}
.stats span{background:rgba(255,255,255,0.12);padding:8px 18px;border-radius:100px}
.main{padding:48px 0 80px}
.section-title{font-size:28px;margin-bottom:8px;font-weight:700}
.section-sub{color:var(--text2);font-size:16px;margin-bottom:32px;max-width:500px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:48px}
.cat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;cursor:pointer;transition:all 0.25s}
.cat-card:hover{border-color:var(--primary);transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.cat-emoji{font-size:36px;margin-bottom:10px}
.cat-name{font-size:16px;font-weight:700;margin-bottom:4px}
.cat-desc{font-size:13px;color:var(--text2);line-height:1.4}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:40px}
.sub-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:20px;cursor:pointer;transition:all 0.2s;display:flex;justify-content:space-between;align-items:center}
.sub-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.sub-name{font-size:15px;font-weight:600}
.sub-count{font-size:13px;color:var(--text2);margin-top:4px}
.sub-arrow{color:var(--text3);font-size:20px}
.breadcrumb{display:flex;gap:10px;align-items:center;margin-bottom:20px;font-size:14px;color:var(--text2);flex-wrap:wrap}
.breadcrumb a{color:var(--primary);text-decoration:none;font-weight:600;cursor:pointer}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.results-found{font-size:18px;font-weight:700}
.results-found span{color:var(--text2);font-weight:400}
.sort-btn{padding:8px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:100px;font-size:13px;cursor:pointer;color:var(--text2)}
.result-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:16px;box-shadow:var(--shadow);transition:all 0.2s}
.result-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow-lg)}
.result-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}
.result-header h3{font-size:20px;font-weight:700;line-height:1.3}
.compare-checkbox{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--text2);background:var(--bg);padding:6px 12px;border-radius:100px}
.meta{color:var(--text2);font-size:14px;margin-bottom:14px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.badge{display:inline-flex;align-items:center;padding:6px 14px;border-radius:100px;font-size:12px;font-weight:700}
.badge-pct{background:var(--primary);color:white}
.badge-verified{background:var(--success);color:white}
.badge-ntee{background:var(--primary-light);color:var(--primary-dark)}
.insight{background:var(--accent-light);border-left:4px solid var(--accent);border-radius:0 16px 16px 0;padding:18px;margin:16px 0;font-size:15px}
.insight.strong{background:linear-gradient(135deg,#ecfdf5 0%,var(--surface) 100%);border-left-color:var(--success)}
.insight.gentle{background:linear-gradient(135deg,#fffbeb 0%,var(--surface) 100%);border-left-color:var(--warning)}
.insight.needs{background:linear-gradient(135deg,#fef2f2 0%,var(--surface) 100%);border-left-color:var(--love)}
.insight-title{display:block;margin-bottom:6px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.8px;color:var(--accent)}
.insight.strong .insight-title{color:var(--success)}
.insight.gentle .insight-title{color:var(--warning)}
.insight.needs .insight-title{color:var(--love)}
.bar{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:var(--text2)}
.bar-bg{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;max-width:240px}
.bar-fill{height:100%;border-radius:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--primary);color:white;text-decoration:none;border-radius:100px;font-size:14px;font-weight:700;border:none;cursor:pointer}
.btn:hover{background:var(--primary-dark)}
.btn-outline{padding:12px 24px;background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);border-radius:100px;font-size:14px;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:80px 20px;color:var(--text2)}
.empty-emoji{font-size:48px;margin-bottom:16px}
.loading-wrap{text-align:center;padding:60px 20px;color:var(--text2)}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.compare-tray{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--border);padding:16px 24px;box-shadow:0 -8px 40px rgba(0,0,0,0.1);display:none;z-index:100}
.compare-tray.active{display:block}
.compare-tray-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.compare-items{display:flex;gap:12px;flex-wrap:wrap}
.compare-item{background:var(--primary-light);color:var(--primary-dark);padding:8px 16px;border-radius:100px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.compare-item button{background:none;border:none;color:var(--primary-dark);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.detail-view{display:none;max-width:800px;margin:0 auto;padding:40px 24px}
.detail-view.active{display:block}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:28px;color:var(--text2);cursor:pointer;font-size:15px;font-weight:600;padding:8px 0}
.back:hover{color:var(--primary)}
.detail-hero{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:36px;margin-bottom:24px;box-shadow:var(--shadow)}
.detail-hero h1{font-size:32px;font-weight:800;margin-bottom:10px}
.detail-meta{color:var(--text2);font-size:15px;margin-bottom:16px}
.ntee-tag{display:inline-block;background:var(--primary-light);color:var(--primary-dark);padding:6px 16px;border-radius:100px;font-size:13px;font-weight:700;margin-bottom:12px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.detail-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:28px}
.detail-card h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:12px;font-weight:800}
.detail-value{font-size:32px;font-weight:800;color:var(--text);margin-bottom:6px}
.detail-label{font-size:14px;color:var(--text2)}
.mission{font-style:italic;color:var(--text);line-height:1.7;font-size:16px}
.pp-info{margin-top:20px;padding-top:20px;border-top:1.5px solid var(--border)}
.pp-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px solid var(--border)}
.pp-row:last-child{border-bottom:none}
.pp-row span:first-child{color:var(--text2);font-weight:500}
.pp-row span:last-child{color:var(--text);font-weight:600}
.pp-row a{color:var(--primary);font-weight:700;text-decoration:none}
.empty-state-box{background:var(--bg);border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;margin-top:16px}
.empty-state-box p{color:var(--text2);font-size:15px;line-height:1.6}
.heart{font-size:32px;margin-bottom:12px}
@media(max-width:768px){
.hero h1{font-size:32px}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.sub-grid{grid-template-columns:1fr}
.detail-grid{grid-template-columns:1fr}
.result-header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div id="app">
  <div class="hero">
    <div class="container">
      <h1>Find where your giving matters most.</h1>
      <p>Every nonprofit has a story. We help you read between the lines.</p>
      <div class="search-wrap">
        <input type="text" id="q" placeholder="Search by name, city, or cause..." autocomplete="off">
        <button class="search-btn" onclick="doSearch()">Search</button>
      </div>
      <div class="stats" id="stats">
        <span>45,000+ organizations</span>
        <span>Impact-scored</span>
        <span>Verified profiles</span>
      </div>
    </div>
  </div>

  <div class="main container">
    <div id="home-view">
      <h2 class="section-title">What do you care about?</h2>
      <p class="section-sub">Choose a cause that moves you. We'll show you organizations that need someone exactly like you.</p>
      <div class="grid" id="categories"></div>
    </div>

    <div id="sub-view" style="display:none">
      <div class="breadcrumb" id="sub-breadcrumb"></div>
      <h2 class="section-title" id="sub-title"></h2>
      <p class="section-sub" id="sub-sub"></p>
      <div class="sub-grid" id="subcategories"></div>
    </div>

    <div id="ntee-view" style="display:none">
      <div class="breadcrumb" id="ntee-breadcrumb"></div>
      <h2 class="section-title" id="ntee-title"></h2>
      <p class="section-sub" id="ntee-sub"></p>
      <div id="ntee-results"></div>
    </div>

    <div id="search-view" style="display:none">
      <div class="results-header">
        <div class="results-found" id="results-found"></div>
        <select class="sort-btn" id="sort" onchange="doSearch()">
          <option value="relevance">Best match</option>
          <option value="percentile_high">Impact score: High first</option>
          <option value="percentile_low">Impact score: Needs most help</option>
          <option value="revenue_high">Largest organizations</option>
        </select>
      </div>
      <div id="results"></div>
    </div>
  </div>
</div>

<div id="detail-view" class="detail-view">
  <div class="container">
    <div class="back" onclick="goBack()">&#8592; Back</div>
    <div id="detail-content"></div>
  </div>
</div>

<div class="compare-tray" id="compare-tray">
  <div class="compare-tray-inner">
    <div class="compare-items" id="compare-items"></div>
    <div style="display:flex;gap:10px">
      <button class="btn-outline" onclick="clearCompare()">Clear</button>
      <button class="btn" onclick="runCompare()">Compare (<span id="compare-count">0</span>)</button>
    </div>
  </div>
</div>

<script>
// --- SAFE RENDERING ---
function $(id){return document.getElementById(id);}

var compareSet=new Set();
var lastResults=[];
var viewStack=[];
var currentMajor=null;

var CATS=[
  {code:"A",name:"Arts, Culture & Humanities",desc:"Celebrate creativity",emoji:"🎭"},
  {code:"B",name:"Education",desc:"Open doors for learners",emoji:"📚"},
  {code:"C",name:"Environment & Animals",desc:"Protect what cannot protect itself",emoji:"🌿"},
  {code:"D",name:"Health — General",desc:"Help people heal",emoji:"🏥"},
  {code:"E",name:"Health — Hospitals",desc:"Be there in crisis",emoji:"🩺"},
  {code:"F",name:"Mental Health",desc:"Hold space for struggle",emoji:"💚"},
  {code:"G",name:"Voluntary Health",desc:"Fight disease together",emoji:"🎗️"},
  {code:"H",name:"Medical Research",desc:"Fund tomorrow's cures",emoji:"🔬"},
  {code:"I",name:"Crime & Legal",desc:"Stand up for justice",emoji:"⚖️"},
  {code:"J",name:"Employment",desc:"Help someone find dignity in work",emoji:"💼"},
  {code:"K",name:"Food & Nutrition",desc:"Fill empty plates",emoji:"🍎"},
  {code:"L",name:"Housing & Shelter",desc:"Help people find home",emoji:"🏠"},
  {code:"M",name:"Public Safety",desc:"Keep communities safe",emoji:"🚒"},
  {code:"N",name:"Recreation & Sports",desc:"Give kids a place to belong",emoji:"⚽"},
  {code:"O",name:"Youth Development",desc:"Invest in tomorrow's leaders",emoji:"🌱"},
  {code:"P",name:"Human Services",desc:"Be there for someone",emoji:"🤝"},
  {code:"Q",name:"International",desc:"Reach across borders",emoji:"🌍"},
  {code:"R",name:"Civil Rights",desc:"Amplify unheard voices",emoji:"📢"},
  {code:"S",name:"Community Improvement",desc:"Make your neighborhood stronger",emoji:"🏘️"},
  {code:"T",name:"Philanthropy",desc:"Multiply generosity",emoji:"💝"},
  {code:"U",name:"Science & Technology",desc:"Fund human curiosity",emoji:"🚀"},
  {code:"V",name:"Social Science",desc:"Understand us better",emoji:"📊"},
  {code:"W",name:"Public Benefit",desc:"Strengthen the common good",emoji:"🏛️"},
  {code:"X",name:"Religion-Related",desc:"Nourish the spirit",emoji:"✨"}
];

function init(){
  try{
    renderCats();
    // Update stats from API if available
    fetch('/health').then(function(r){return r.json();}).then(function(d){
      $('stats').innerHTML='<span>'+d.orgs.toLocaleString()+' organizations</span><span>'+(d.with_percentiles||0)+' MERIT-scored</span><span>'+(d.with_propublica||0)+' verified profiles</span>';
    }).catch(function(){});
    // Enter key on search
    $('q').addEventListener('keypress',function(e){if(e.key==='Enter')doSearch();});
  }catch(e){
    console.error('init error:',e);
  }
}

function renderCats(){
  var html='';
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    html+='<div class="cat-card" onclick="showSubs(\''+c.code+'\')">'+
      '<div class="cat-emoji">'+c.emoji+'</div>'+
      '<div class="cat-name">'+c.name+'</div>'+
      '<div class="cat-desc">'+c.desc+'</div>'+
      '</div>';
  }
  $('categories').innerHTML=html;
}

function showSubs(major){
  currentMajor=major;
  viewStack.push('home');
  hideAll();
  $('sub-view').style.display='block';
  var cat=CATS.find(function(c){return c.code===major;});
  $('sub-breadcrumb').innerHTML='<a onclick="goBack()">What do you care about?</a> <span>/</span> <span>'+cat.name+'</span>';
  $('sub-title').innerHTML=cat.emoji+' '+cat.name;
  $('sub-sub').innerHTML=cat.desc+'. Here are the specific ways organizations in this space make a difference.';
  $('subcategories').innerHTML='<div class="loading-wrap"><div class="spinner"></div><div>Loading subcategories...</div></div>';
  
  fetch('/subcategories/'+major)
    .then(function(r){if(!r.ok)throw new Error('err'+r.status);return r.json();})
    .then(function(d){
      if(!d.subcategories||!d.subcategories.length){
        $('subcategories').innerHTML='<div class="empty"><div class="empty-emoji">🔍</div><div>No subcategories found.</div></div>';
        return;
      }
      var h='';
      for(var i=0;i<d.subcategories.length;i++){
        var s=d.subcategories[i];
        h+='<div class="sub-card" onclick="showNtee(\''+s.full_ntee+'\',\''+d.major_name+'\',\''+s.name.replace(/'/g,"\\'")+'\')">'+
          '<div class="sub-info">'+
          '<div class="sub-name">'+s.name+'</div>'+
          '<div class="sub-count">'+s.count.toLocaleString()+' organizations</div>'+
          '</div><div class="sub-arrow">&#8594;</div></div>';
      }
      $('subcategories').innerHTML=h;
    })
    .catch(function(e){
      console.error(e);
      $('subcategories').innerHTML='<div class="empty"><div class="empty-emoji">😔</div><div>Error loading. <button class="btn" onclick="showSubs(\''+major+'\')" style="margin-top:16px">Retry</button></div></div>';
    });
}

function showNtee(ntee,majorName,subName){
  viewStack.push('sub');
  hideAll();
  $('ntee-view').style.display='block';
  $('ntee-breadcrumb').innerHTML='<a onclick="goBack()">Causes</a> <span>/</span> <a onclick="goBack()">'+majorName+'</a> <span>/</span> <span>'+subName+'</span>';
  $('ntee-title').innerHTML=subName;
  $('ntee-sub').innerHTML='Organizations focused on '+subName.toLowerCase()+'.';
  $('ntee-results').innerHTML='<div class="loading-wrap"><div class="spinner"></div><div>Loading organizations...</div></div>';
  
  fetch('/ntee/'+ntee)
    .then(function(r){if(!r.ok)throw new Error('err'+r.status);return r.json();})
    .then(function(d){
      if(!d.organizations||!d.organizations.length){
        $('ntee-results').innerHTML='<div class="empty"><div class="empty-emoji">💭</div><div>No organizations found.</div></div>';
        return;
      }
      lastResults=d.organizations;
      sortRes();
      $('ntee-results').innerHTML=lastResults.map(renderCard).join('');
    })
    .catch(function(e){
      console.error(e);
      $('ntee-results').innerHTML='<div class="empty"><div class="empty-emoji">😔</div><div>Error. <button class="btn" onclick="showNtee(\''+ntee+'\',\''+majorName+'\',\''+subName+'\')" style="margin-top:16px">Retry</button></div></div>';
    });
}

function doSearch(){
  var val=$('q').value.trim();
  if(!val){showHome();return;}
  hideAll();
  $('search-view').style.display='block';
  viewStack=['search'];
  $('results').innerHTML='<div class="loading-wrap"><div class="spinner"></div><div>Searching...</div></div>';
  fetch('/search?q='+encodeURIComponent(val)+'&limit=24')
    .then(function(r){return r.json();})
    .then(function(data){
      lastResults=data.results||[];
      sortRes();
      renderRes(data.count||0);
    })
    .catch(function(){
      $('results').innerHTML='<div class="empty"><div class="empty-emoji">😔</div><div>Search failed. Please try again.</div></div>';
    });
}

function hideAll(){
  $('home-view').style.display='none';
  $('sub-view').style.display='none';
  $('ntee-view').style.display='none';
  $('search-view').style.display='none';
  $('detail-view').classList.remove('active');
  $('app').style.display='block';
}

function showHome(){
  viewStack=[];
  hideAll();
  $('home-view').style.display='block';
  $('q').value='';
}

function goBack(){
  if(viewStack.length){
    var prev=viewStack.pop();
    if(prev==='home')showHome();
    else if(prev==='sub'){$('ntee-view').style.display='none';$('sub-view').style.display='block';}
    else if(prev==='search'){$('detail-view').classList.remove('active');$('app').style.display='block';$('search-view').style.display='block';}
  }else{
    showHome();
  }
}

function sortRes(){
  var sort=$('sort').value;
  if(sort==='percentile_high')lastResults.sort(function(a,b){return parseFloat(b.percentile||0)-parseFloat(a.percentile||0);});
  else if(sort==='percentile_low')lastResults.sort(function(a,b){return parseFloat(a.percentile||0)-parseFloat(b.percentile||0);});
  else if(sort==='revenue_high')lastResults.sort(function(a,b){return parseFloat(b.revenue||0)-parseFloat(a.revenue||0);});
}

function renderRes(total){
  $('results-found').innerHTML='Found <span>'+lastResults.length+'</span> organizations'+(total>lastResults.length?' <span>(of '+total.toLocaleString()+')</span>':'');
  if(!lastResults.length){
    $('results').innerHTML='<div class="empty"><div class="empty-emoji">🔍</div><div>No results found.</div></div>';
    return;
  }
  $('results').innerHTML=lastResults.map(renderCard).join('');
}

function fmtMoney(n){
  if(!n)return '$0';
  var num=parseFloat(n);
  if(num>=1000000)return '$'+(num/1000000).toFixed(1)+'M';
  if(num>=1000)return '$'+(num/1000).toFixed(0)+'K';
  return '$'+num.toLocaleString();
}

function renderCard(o){
  var checked=compareSet.has(o.ein)?'checked':'';
  var badges='';
  if(o.ntee)badges+='<span class="badge badge-ntee">'+o.ntee+'</span>';
  if(o.percentile)badges+='<span class="badge badge-pct">Peer Percentile: '+o.percentile+'</span>';
  if(o.has_propublica)badges+='<span class="badge badge-verified">&#10003; Verified</span>';
  
  var insight='';
  if(o.percentile){
    var p=parseFloat(o.percentile);
    var cls='insight',title='Donor Insight',txt='';
    if(p>=90){cls='insight strong';title='Standout Performer';txt='Performs better than most peers in this category. Your support goes further here.';}
    else if(p>=75){cls='insight strong';title='Strong & Steady';txt='Outperforms most similar organizations. A reliable, MERITful choice.';}
    else if(p>=50){title='Solid Ground';txt='Right in the middle — doing honest, solid work alongside its peers.';}
    else if(p>=25){cls='insight gentle';title='Room to Grow';txt='Below peer average, which often means your gift has outsized MERIT.';}
    else{cls='insight needs';title='Needs You Most';txt='Smaller than peers. A single donation often creates outsized community MERIT.';}
    insight='<div class="'+cls+'"><strong class="insight-title">'+title+'</strong><div>'+txt+'</div></div>';
  }
  
  return '<div class="result-card">'+
    '<div class="result-header"><h3>'+o.name+'</h3>'+
    '<label class="compare-checkbox"><input type="checkbox" '+checked+' onchange="toggleCompare(\''+o.ein+'\',\''+o.name.replace(/'/g,"\\'")+'\')"> Compare</label></div>'+
    '<div class="meta">'+(o.city?o.city+', ':'')+o.state+' · '+fmtMoney(o.revenue)+' annual revenue</div>'+
    '<div class="badges">'+badges+'</div>'+insight+
    '<div style="margin-top:18px"><button class="btn" onclick="loadOrg(\''+o.ein+'\')">See their story &#8594;</button></div>'+
    '</div>';
}

function toggleCompare(ein,name){
  if(compareSet.has(ein)){compareSet.delete(ein);}else{if(compareSet.size>=3){alert('Compare up to 3 organizations.');return;}compareSet.add(ein);}
  updateTray();
  refreshCB();
}

function updateTray(){
  var tray=$('compare-tray');
  if(!compareSet.size){tray.classList.remove('active');return;}
  tray.classList.add('active');
  var h='';
  compareSet.forEach(function(ein){
    var o=lastResults.find(function(x){return x.ein===ein;})||{name:ein};
    h+='<div class="compare-item">'+o.name+'<button onclick="toggleCompare(\''+ein+'\',\'\')">&times;</button></div>';
  });
  $('compare-items').innerHTML=h;
  $('compare-count').textContent=compareSet.size;
}

function refreshCB(){
  document.querySelectorAll('.compare-checkbox input').forEach(function(cb){
    var m=cb.getAttribute('onchange');
    if(m){
      var ein=m.match(/'([^']+)'/);
      if(ein)cb.checked=compareSet.has(ein[1]);
    }
  });
}

function clearCompare(){compareSet.clear();updateTray();refreshCB();}

function runCompare(){
  if(compareSet.size<2){alert('Select at least 2 organizations.');return;}
  var items=[];
  compareSet.forEach(function(ein){
    var o=lastResults.find(function(x){return x.ein===ein;});
    if(o)items.push(o);
  });
  if(items.length<2){alert('View these organizations in results before comparing.');return;}
  var h='<div style="margin-bottom:28px"><h2 style="font-size:28px">Side by side</h2><p style="color:var(--text2);margin-top:6px">Where should your next gift go?</p></div>';
  h+='<div style="display:grid;grid-template-columns:'+('1fr '.repeat(items.length))+';gap:16px">';
  items.forEach(function(o){
    h+='<div class="detail-card"><h3 style="margin-bottom:12px">'+o.name+'</h3>'+
      '<div class="detail-value" style="font-size:22px">'+fmtMoney(o.revenue)+'</div>'+
      '<div class="detail-label">Annual revenue</div>'+
      (o.percentile?'<div style="margin-top:12px"><span class="badge badge-pct">Score: '+o.percentile+'</span></div>':'')+
      '</div>';
  });
  h+='</div>';
  hideAll();
  $('detail-view').classList.add('active');
  $('detail-content').innerHTML=h+'<div style="margin-top:28px"><button class="btn-outline" onclick="goBack()">Back</button></div>';
}

function loadOrg(ein){
  hideAll();
  $('detail-view').classList.add('active');
  window.scrollTo(0,0);
  $('detail-content').innerHTML='<div class="loading-wrap"><div class="spinner"></div><div>Loading profile...</div></div>';
  fetch('/org/'+ein)
    .then(function(r){return r.json();})
    .then(function(o){
      if(o.detail)throw new Error(o.detail);
      var pp=(o.propublica&&o.propublica.organization)?o.propublica.organization:{};
      var pct=o.percentile_data||{};
      var nteeDisplay=o.ntee?'<div class="ntee-tag">'+o.ntee+'</div>':'';
      var ppHtml='';
      if(pp.careofname||pp.address||pp.website){
        ppHtml='<div class="pp-info">';
        if(pp.careofname)ppHtml+='<div class="pp-row"><span>Led by</span><span>'+pp.careofname+'</span></div>';
        if(pp.address)ppHtml+='<div class="pp-row"><span>Location</span><span>'+pp.address+(pp.city?', '+pp.city:'')+(pp.state?' '+pp.state:'')+'</span></div>';
        if(pp.website)ppHtml+='<div class="pp-row"><span>Website</span><a href="'+pp.website+'" target="_blank">'+pp.website.replace(/^https?:\/\//,'')+'</a></div>';
        ppHtml+='</div>';
      }
      var missionText=pp.mission||pp.careofname;
      $('detail-content').innerHTML=
        '<div class="detail-hero"><h1>'+o.name+'</h1>'+
        '<div class="detail-meta">'+(o.city?o.city+', ':'')+o.state+' · EIN: '+o.ein+' · Tax Year: '+o.tax_year+'</div>'+
        nteeDisplay+
        '<div class="badges" style="margin-top:14px">'+
        (pct.percentile?'<span class="badge badge-pct">Peer Percentile: '+pct.percentile+'</span>':'')+
        (o.propublica?'<span class="badge badge-verified">&#10003; Verified</span>':'')+
        '</div></div>'+
        '<div class="detail-grid">'+
        '<div class="detail-card">'+
        '<h4>Financial Snapshot</h4>'+
        '<div class="detail-value">'+fmtMoney(o.revenue)+'</div>'+
        '<div class="detail-label">Annual revenue</div>'+
        '</div>'+
        '<div class="detail-card">'+
        '<h4>About</h4>'+
        (missionText?'<div class="mission">"'+missionText+'"</div>':
        '<div class="empty-state-box"><div class="heart">&#128155;</div><p>Mission statement not available in IRS records. Visit ProPublica or GuideStar to learn more.</p></div>')+
        ppHtml+
        (pp.website?'<div style="margin-top:20px"><a href="'+pp.website+'" target="_blank" class="btn">Visit their website &#8599;</a></div>':'')+
        '</div></div>';
    })
    .catch(function(){
      $('detail-content').innerHTML='<div class="empty"><div class="empty-emoji">&#128532;</div><div>Failed to load. <button class="btn-outline" onclick="goBack()" style="margin-top:16px">Go back</button></div></div>';
    });
}

// Start
init();
</script>
</body>
</html>

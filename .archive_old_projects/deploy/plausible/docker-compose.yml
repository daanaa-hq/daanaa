# Plausible Analytics (Community Edition) — self-hosted on the home box.
# Privacy-respecting, cookieless, no third-party tracking (STEWARDSHIP P2).
# Public ingest happens via a Cloudflare Tunnel to stats.daanaa.org (see README);
# this compose only binds locally (127.0.0.1) so nothing is exposed without the tunnel.
#
#   docker compose --env-file plausible-conf.env up -d
#
services:
  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - plausible_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=plausible
      - POSTGRES_DB=plausible_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible -d plausible_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    volumes:
      - plausible_events:/var/lib/clickhouse
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-log.xml:/etc/clickhouse-server/config.d/low-log.xml:ro
    environment:
      - CLICKHOUSE_DB=plausible_events_db
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.4
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    # Bind to localhost only — the Cloudflare Tunnel is the sole public path in.
    ports:
      - "127.0.0.1:18000:8000"
    env_file:
      - plausible-conf.env
    environment:
      - DATABASE_URL=postgres://plausible:${POSTGRES_PASSWORD}@plausible_db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://default:${CLICKHOUSE_PASSWORD}@plausible_events_db:8123/plausible_events_db

volumes:
  plausible_db:
  plausible_events:

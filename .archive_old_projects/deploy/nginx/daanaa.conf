# Daanaa production nginx — source of truth
#
# Deployed to the droplet at: /etc/nginx/sites-enabled/daanaa
# Apply with:
#   rsync -az deploy/nginx/daanaa.conf root@162.243.97.179:/etc/nginx/sites-enabled/daanaa -e "ssh -i ~/.ssh/daanaa_do"
#   ssh -i ~/.ssh/daanaa_do root@162.243.97.179 'nginx -t && systemctl reload nginx'
#
# Notes:
#   - Cloudflare fronts the origin (Full strict). Origin TLS uses a Cloudflare
#     Origin Certificate at /etc/ssl/cloudflare/daanaa.{pem,key} (key chmod 600).
#     Those cert files are NOT in the repo (secrets) — regenerate from the
#     Cloudflare dashboard: SSL/TLS -> Origin Server -> Create Certificate
#     (hostnames daanaa.org + *.daanaa.org).
#   - The droplet serves the React SPA via gunicorn (droplet_api:app) on :5000.
#     nginx serves /assets/, /sitemap.xml, /robots.txt straight from dist.

# www -> canonical https redirect (http + https)
server {
    listen 80;
    listen 443 ssl;
    server_name www.daanaa.org;

    ssl_certificate     /etc/ssl/cloudflare/daanaa.pem;
    ssl_certificate_key /etc/ssl/cloudflare/daanaa.key;

    return 301 https://daanaa.org$request_uri;
}

# canonical origin (http + https; https is what Cloudflare Full strict uses)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name daanaa.org _;

    ssl_certificate     /etc/ssl/cloudflare/daanaa.pem;
    ssl_certificate_key /etc/ssl/cloudflare/daanaa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Pass real client IP from Cloudflare
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # Legacy / guessed URL redirects -> real paths (avoid 404 on inbound links)
    location = /privacy { return 301 /legal; }
    location = /contact { return 301 /feedback; }
    location ~ ^/nonprofit/(.*)$ { return 301 /org/$1; }
    location ~ ^/cause/(.*)$     { return 301 /category/$1; }

    # Serve sitemap and robots directly from dist (do not send to gunicorn)
    location = /sitemap.xml {
        alias /opt/daanaa/frontend/dist/sitemap.xml;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location = /robots.txt {
        alias /opt/daanaa/frontend/dist/robots.txt;
    }

    # Static assets with long cache
    location /assets/ {
        alias /opt/daanaa/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # All other requests -> gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
    }
}

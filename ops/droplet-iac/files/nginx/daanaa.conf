# /etc/nginx/sites-available/daanaa  (symlinked to sites-enabled/daanaa)
# Port 80: ACME challenge for certbot renewal + plain-HTTP proxy to gunicorn.
# Pinned from the live, verified-clean config on 107.170.26.8 (2026-08-14) —
# see ../../snapshot/nginx-T.txt for the exact source dump.
#
# IMPORTANT: SSL lives in daanaa-ssl.conf ONLY. Do not add
# ssl_certificate / ssl_certificate_key directives to this file — that
# duplicate-SSL-directive mistake is what caused the 502 incident this
# playbook exists to prevent. See README.md "How this would have
# prevented each incident".

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name daanaa.org www.daanaa.org _;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ { root /var/www/acme; }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

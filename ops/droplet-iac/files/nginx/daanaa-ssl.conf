# /etc/nginx/sites-available/daanaa-ssl  (symlinked to sites-enabled/daanaa-ssl)
# Port 443: TLS termination + proxy to gunicorn.
# Pinned from the live, verified-clean config on 107.170.26.8 (2026-08-14).
#
# THE ONLY FILE in this nginx config set allowed to declare
# ssl_certificate / ssl_certificate_key. provision.sh's nginx_deploy()
# checks for this before writing anything (see drift-check.sh's
# duplicate-ssl-directive check) — a second file defining SSL is exactly
# how the incident that prompted this playbook happened.
#
# Certbot runs in webroot mode (see files/systemd and README) — it does
# NOT own or auto-edit this file. Cert paths below are static and must be
# kept in sync with whatever domain certbot issued for
# (/etc/letsencrypt/live/daanaa.org/).

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl default_server;

    server_name daanaa.org www.daanaa.org _;

    ssl_certificate     /etc/letsencrypt/live/daanaa.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daanaa.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

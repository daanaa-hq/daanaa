# /etc/systemd/system/daanaa-api.service.d/env-override.conf
#
# DESIGN NOTE (read before editing): systemd drop-ins REPLACE same-key
# Environment= entries from the base unit wholesale — they do NOT merge
# per-key. This exact mechanism is what silently disabled DAANAA_PROD in
# production on the live droplet (see ../../snapshot/systemd-env-override.txt
# and finding #1 in the snapshot doc): someone added a drop-in meaning to
# only set FLASK_ENV/DB_PATH, and it also blanked DAANAA_PROD to empty string
# because they repeated the key without a value.
#
# STRUCTURAL FIX applied here: this override file only sets keys that are
# NOT already set correctly by the base unit (daanaa-api.service already
# sets DAANAA_PROD=1 and PRECOMPUTE_DIR/CLAIMS_DIR/FRONTEND_DIR — this
# file must never repeat any of those keys). If a future change genuinely
# needs to override one of those, it must set it to the intended value
# here, never to an empty placeholder — drift-check.sh will flag any
# Environment= line in the live drop-in with an empty value as a hard
# failure, specifically to catch a repeat of this bug.
#
# DO NOT APPLY THIS FILE AS-IS YET (2026-08-15 update): attempted live and
# caused a ~45s outage. droplet_api.py has a hard startup guard — if
# DAANAA_PROD is truthy, it refuses to boot unless DAANAA_CLAIM_SECRET or
# DAANAA_ADMIN_KEY is also set (line ~877-881), specifically to stop prod
# running with a dev secret. Neither is configured anywhere on this droplet
# (verified: `systemctl show daanaa-api -p Environment` and grep across
# /etc/systemd/system + /opt/daanaa/.env both come up empty). Sequence
# required before DAANAA_PROD can safely go back to 1:
#   1. Generate a strong secret (e.g. `openssl rand -hex 32`).
#   2. Add `Environment="DAANAA_ADMIN_KEY=<value>"` to this file, apply,
#      restart, verify /health AND an admin-gated route before touching
#      DAANAA_PROD at all.
#   3. Only then uncomment DAANAA_PROD from the base unit (remove any
#      override here) and repeat the restart+verify cycle.
# Each step gets its own restart + smoke test — do not combine them.
# Currently reverted on the live droplet to the last-known-good (DAANAA_PROD=
# blank, matching the pre-incident state) while this sequence is scheduled.
#
# DB_PATH CORRECTION (2026-08-14, post-recon verification): the original
# snapshot flagged DB_PATH=/opt/daanaa/data/merit_registry.db as pointing at
# a nonexistent file and recommended dropping it. That was true at recon
# time but is WRONG now — the V6.1 scorer database (25GB, includes
# merit_percentile_v6) was rsynced to that exact path later the same day,
# and droplet_api.py's /api/organizations/<ein> route (get_db() at line 970,
# DB_PATH read at line 787) genuinely queries it live via SQLite — this is
# NOT dead code and NOT precompute-only. Verified directly: curl against
# https://daanaa.org/api/organizations/391214392 returns merit_percentile_v6
# and merit_percentile_confidence_v6 from this exact DB_PATH. Do NOT drop
# DB_PATH — if unset, droplet_api.py falls back to
# ~/meritgiving/data/merit_registry.db, which as root resolves to
# /root/meritgiving/data/merit_registry.db and does not exist, breaking
# every org-detail request. Verify against droplet_api.py source again
# before ever changing this path.

[Service]
Environment="FLASK_ENV=production"
Environment="DB_PATH=/opt/daanaa/data/merit_registry.db"

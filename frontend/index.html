<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daanaa — See the overlooked. Give with heart.</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daanaa" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <!-- Canonical (server-injected per route; defaults to home) -->
    <link rel="canonical" href="https://daanaa.org/" />

    <!-- Social / og: -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://daanaa.org/" />
    <meta property="og:site_name" content="Daanaa" />
    <meta property="og:title" content="Daanaa — Find causes near you making a difference." />
    <meta property="og:description" content="Discover 1.8+ million active U.S. nonprofits including the ones you've never heard of. Giving Wallet to keep track of your giving for tax season. Private by design, no fees or charges ever !" />
    <meta property="og:image" content="https://daanaa.org/logo.png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daanaa — Find causes near you making a difference." />
    <meta name="twitter:description" content="Discover 1.8+ million active U.S. nonprofits including the ones you've never heard of. Giving Wallet to keep track of your giving for tax season. Private by design, no fees or charges ever !" />
    <meta name="twitter:image" content="https://daanaa.org/logo.png" />
    <meta name="description" content="Explore U.S. nonprofits using public IRS records, peer financial context, and AI assisted search. Daanaa is independent, donation-neutral, and not affiliated with the IRS." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Privacy-friendly analytics by Plausible -->
    <script async data-domain="daanaa.org" src="https://plausible.io/js/pa-HxETg5B2WL7zC_hBzykIZ.js"></script>
    <script src="/plausible-init.js?v=2"></script>
  </head>
  <body>
    <!-- Apply saved theme before React mounts to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('daanaa-theme');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) { /* private mode / storage blocked: default dark */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
